<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">
    <body>
        <ui:composition template="/plantillas/layout.xhtml">

            <ui:param name="bodyClass" value="uppa-body uppa-light"/>
            <ui:define name="titulo">Inicio | Úppa</ui:define>

            <ui:define name="content">
                <h:outputStylesheet library="css" name="dashboard.css"/>
                <h:outputStylesheet library="css" name="reconocimiento.css"/>

                <div class="dash">

                    <!-- Saludo -->
                    <div class="dash-hello">¡Hola!, #{aSesion.nombre}</div>
                    <div class="dash-title-row">
                        <i class="pi pi-search"></i>
                        <h1 class="dash-title">¿Qué vamos<br/>a analizar hoy?</h1>
                    </div>

                    <!-- Tarjeta principal de escaneo -->
                    <div class="hero-scan">
                        <p:tag value="En menos de 10 segundos!" icon="pi pi-clock" styleClass="tag-lime"/>
                        <div class="hero-scan-title">Identifica ahora</div>
                        <div class="hero-scan-text">Sube o toma una foto y deja que la IA te ayude.</div>
                        <p:button value="Empezar a escanear" icon="pi pi-search"
                                  outcome="/vistas/reconocimiento/index" 
                                  styleClass="btn-verde"/>
                    </div>

                    <!-- Cómo comenzar -->
                    <section class="sec">
                        <div class="sec-head">
                            <h2>Cómo comenzar</h2>
                            <small>En solo 3 pasos</small>
                        </div>

                        <div class="steps">
                            <ui:repeat var="s" value="#{[
                                {'n':'01','title':'Toma una foto','desc':'Centra el hongo bien iluminado dentro del marco.','color':'#80b67e','icon':'pi-camera'},
                                {'n':'02','title':'Análisis con IA','desc':'Identifica especie, comestibilidad y enfermedades.','color':'#f9cb43','icon':'pi-star'},
                                {'n':'03','title':'Tratamientos','desc':'Recibe descripción y opciones de tratamiento.','color':'#368ab8','icon':'pi-shield'}]}">
                                <div class="step">
                                    <div class="step-ico" style="background: #{s.color}1f; color: #{s.color};">
                                        <i class="pi #{s.icon}"></i>
                                    </div>
                                    <div>
                                        <div class="step-title">#{s.title}</div>
                                        <div class="step-desc">#{s.desc}</div>
                                    </div>
                                </div>
                            </ui:repeat>
                        </div>
                    </section>

                    <!-- Identificaciones recientes (desde la tabla analisis) -->
                    <section class="sec">
                        <div class="sec-head">
                            <h2>Identificaciones recientes</h2>
                            <p:link value="Ver todas" outcome="/vistas/reconocimiento/historial" styleClass="link-olive"/>
                        </div>

                        <h:panelGroup layout="block" styleClass="vacio" rendered="#{empty aAnalisis.recientes}">
                            <i class="pi pi-images"></i>
                            <p>Aún no tienes identificaciones. ¡Analiza tu primer hongo!</p>
                            <p:button value="Identificar ahora" icon="pi pi-search"
                                      outcome="/vistas/reconocimiento/index" styleClass="btn-verde"/>
                        </h:panelGroup>

                        <div class="recent">
                            <ui:repeat var="m" value="#{aAnalisis.recientes}">
                                <ui:include src="/plantillas/tarjeta-analisis.xhtml">
                                    <ui:param name="a" value="#{m}"/>
                                </ui:include>
                            </ui:repeat>
                        </div>
                    </section>

                </div>
            </ui:define>

        </ui:composition>
    </body>
</html>
