<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<!--
    Tarjeta de un análisis guardado (modelo.Analisis).
    Parámetro: a = Analisis. Usada en dashboard.xhtml y reconocimiento/historial.xhtml.
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://primefaces.org/ui">

    <p:card styleClass="recent-card">
        <f:facet name="header">
            <h:link outcome="/vistas/reconocimiento/show" styleClass="recent-img-wrap">
                <f:param name="id" value="#{a.analisisPK.idAnalisis}"/>
                <img src="#{aAnalisis.urlImagen(a)}" alt="#{a.hongo.nombreCientifico}" loading="lazy"/>
                <span class="recent-status">
                    <p:tag value="Sano" styleClass="tag-sano" rendered="#{empty a.idEnfermedad}"/>
                    <p:tag value="Plaga detectada" styleClass="tag-plaga" rendered="#{not empty a.idEnfermedad}"/>
                </span>
            </h:link>
        </f:facet>

        <div class="fields">
            <div class="field">
                <span class="field-label"><i class="pi pi-book"></i> Nombre común:</span>
                <p:tag value="#{a.hongo.nombreComun}" styleClass="tag-amarillo"/>
            </div>
            <div class="field">
                <span class="field-label"><i class="pi pi-bookmark"></i> Nombre científico:</span>
                <p:tag value="#{a.hongo.nombreCientifico}" styleClass="tag-lima"/>
            </div>

            <h:panelGroup layout="block" styleClass="field" rendered="#{not empty a.idEnfermedad}">
                <span class="field-label"><i class="pi pi-exclamation-triangle"></i> Nombre común de la enfermedad:</span>
                <p:tag value="#{a.idEnfermedad.nombreComun}" styleClass="tag-rojo"/>
            </h:panelGroup>
            <h:panelGroup layout="block" styleClass="field" rendered="#{not empty a.idEnfermedad}">
                <span class="field-label"><i class="pi pi-shield"></i> Nombre científico de la enfermedad:</span>
                <p:tag value="#{a.idEnfermedad.nombreCientifico}" styleClass="tag-rojo"/>
            </h:panelGroup>

            <div class="field">
                <span class="field-label"><i class="pi pi-calendar"></i> Fecha de análisis:</span>
                <span class="ui-tag ui-widget tag-gris">
                    <span class="ui-tag-value">
                        <h:outputText value="#{a.fecha}">
                            <f:convertDateTime pattern="dd-MM-yyyy HH:mm" type="date"/>
                        </h:outputText>
                    </span>
                </span>
            </div>
        </div>
    </p:card>

</ui:composition>
