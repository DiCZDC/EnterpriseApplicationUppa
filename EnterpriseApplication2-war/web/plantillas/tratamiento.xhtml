<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<!-- Un tratamiento (modelo.Tratamiento). Parámetro: t -->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <div class="tratamiento triaje-#{empty t.triaje ? 'na' : t.triaje.toLowerCase()}">
        <div class="tratamiento-cab">
            <i class="pi #{t.triaje eq 'Urgente' ? 'pi-ban' : (t.triaje eq 'Alta' ? 'pi-shield' : 'pi-eye')}"></i>
            <span class="tratamiento-triaje">Prioridad: #{empty t.triaje ? 'N/D' : t.triaje}</span>
        </div>
        <p class="tratamiento-pasos">#{t.pasos}</p>
        <h:panelGroup rendered="#{not empty t.requisitos}">
            <p class="tratamiento-req"><b>Necesitas:</b> #{t.requisitos}</p>
        </h:panelGroup>
        <h:panelGroup rendered="#{not empty t.fuente}">
            <p class="tratamiento-fuente">Fuente: #{t.fuente}</p>
        </h:panelGroup>
    </div>

</ui:composition>
